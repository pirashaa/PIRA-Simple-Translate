<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIRA Simple Translate Settings</title><style>
:root{font:15px system-ui,sans-serif;color-scheme:dark;background:#0e1726;color:#eef3fb}*{box-sizing:border-box}body{margin:0;padding:32px 18px;background:#0e1726;color:#eef3fb}.wrap{max-width:760px;margin:auto}.sub{color:#9aabc2}.card{background:#18263a;border:1px solid #33465f;border-radius:16px;padding:20px;margin:16px 0}h1{font-size:26px;margin:0 0 5px}h2{font-size:17px;margin:0 0 15px}label{display:block;font-size:13px;margin:12px 0 6px;color:#bdc9da}input,select,textarea{width:100%;padding:10px;border-radius:9px;border:1px solid #42546e;background:#0d1727;color:inherit;font:inherit}input[type=checkbox]{width:auto;margin-right:8px}input[type=range]{padding:0}button{border:0;border-radius:10px;padding:12px 18px;background:#2563eb;color:white;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.check{display:flex;align-items:center;margin:10px 0}.check label{margin:0}.help{font-size:12px;color:#9aabc2;margin-top:5px}.light{background:#fff;color:#17253a;color-scheme:light}.light .card{background:#f5f8fc;border-color:#dbe4ef}.light input,.light select,.light textarea{background:#fff;color:#17253a;border-color:#ccd7e5}#saveToast{margin-left:12px;color:#72d6a2}.provider-box{margin-top:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}body{padding:22px 12px}}
</style></head><body><main class="wrap"><h1>PIRA Simple Translate</h1><div class="sub">Settings · Developed by Pira Code</div>
<section class="card"><h2>Translation behavior</h2><div class="check"><input type="checkbox" id="autoTranslateEnabled"><label for="autoTranslateEnabled">Translate selected text automatically</label></div><label for="targetLang">Default target language</label><select id="targetLang"><option value="en">English</option><option value="de">German</option><option value="ta">Tamil</option><option value="si">Sinhala</option><option value="hi">Hindi</option><option value="fr">French</option><option value="es">Spanish</option><option value="it">Italian</option><option value="nl">Dutch</option><option value="ar">Arabic</option><option value="ja">Japanese</option><option value="zh">Chinese</option></select><div class="grid"><div><label for="debounceMs">Selection delay: <span id="debounceMsVal"></span></label><input type="range" id="debounceMs" min="100" max="1000" step="50"></div><div><label for="minLength">Minimum text length: <span id="minLengthVal"></span></label><input type="range" id="minLength" min="1" max="30"></div></div><label for="requireModifierKey">Modifier key</label><select id="requireModifierKey"><option value="none">None</option><option value="alt">Alt</option><option value="ctrl">Ctrl</option><option value="shift">Shift</option><option value="ctrl-shift">Ctrl + Shift</option></select><label for="excludedDomains">Excluded websites (one domain per line)</label><textarea id="excludedDomains" rows="3" placeholder="example.com"></textarea></section>
<section class="card"><h2>Appearance and popup</h2><label for="theme">Theme</label><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select><div class="check"><input type="checkbox" id="showOriginalText"><label for="showOriginalText">Show original text</label></div><div class="check"><input type="checkbox" id="showCopyButton"><label for="showCopyButton">Show copy button</label></div><div class="check"><input type="checkbox" id="showListenButton"><label for="showListenButton">Show listen button</label></div></section>
<section class="card"><h2>Translation provider</h2><label for="provider">Provider</label><select id="provider"><option value="google-free">Google Web Translation (unofficial)</option><option value="google-cloud">Google Cloud Translation API</option><option value="deepl">DeepL API</option><option value="libretranslate">LibreTranslate server</option></select><div id="googleCloudBox" class="provider-box"><label for="googleCloudApiKey">Google Cloud API key</label><input type="password" id="googleCloudApiKey" autocomplete="off"><div class="help">Your own Google Cloud account may incur charges.</div></div><div id="deeplBox" class="provider-box"><label for="deeplApiKey">DeepL API key</label><input type="password" id="deeplApiKey" autocomplete="off"><label for="deeplApiType">DeepL account type</label><select id="deeplApiType"><option value="free">Free</option><option value="pro">Pro</option></select></div><div id="libreBox" class="provider-box"><label for="libreTranslateUrl">LibreTranslate server URL</label><input type="url" id="libreTranslateUrl" placeholder="https://your-server.example"><label for="libreTranslateApiKey">API key (if required)</label><input type="password" id="libreTranslateApiKey" autocomplete="off"><div class="help">Chrome asks permission to contact the server when you save this provider.</div></div></section>
<button id="saveBtn">Save settings</button><span id="saveToast" role="status"></span></main><script src="options.js"></script></body></html>
