<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PIRA Simple Translate</title><style>
:root{color-scheme:dark;font:14px system-ui,sans-serif;background:#101827;color:#eef3fb}*{box-sizing:border-box}body{width:360px;margin:0;padding:18px;background:#101827;color:#eef3fb}.light{background:#fff;color:#152238}.brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.brand strong{font-size:17px}.sub{color:#9aa9bd;font-size:12px}.panel{background:#1b293c;border:1px solid #33445b;border-radius:14px;padding:13px;margin:12px 0}.light .panel{background:#f4f7fb;border-color:#dce4ef}label{display:block;font-size:12px;color:#aebbd0;margin:8px 0 5px}select,textarea{width:100%;padding:10px;border-radius:9px;border:1px solid #43546c;background:#101827;color:inherit;font:inherit}textarea{min-height:85px;resize:vertical}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}button{border:0;border-radius:9px;padding:10px 12px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}button.secondary{background:#33445b}.result{min-height:55px;white-space:pre-wrap;overflow-wrap:anywhere;color:inherit}.toggle{display:flex;align-items:center;gap:8px}.toggle input{width:auto}.foot{display:flex;justify-content:space-between;align-items:center;font-size:12px}.foot a{color:#60a5fa}
</style></head><body><header class="brand"><div><strong>PIRA Simple Translate</strong><div class="sub">Developed by Pira Code</div></div><span>🌐</span></header><section class="panel"><label class="toggle"><input type="checkbox" id="autoTranslateToggle" checked> Automatic translation on text selection</label><div class="row"><div><label for="sourceSelect">From</label><select id="sourceSelect"><option value="auto">Detect language</option><option value="en">English</option><option value="de">German</option><option value="ta">Tamil</option><option value="si">Sinhala</option><option value="fr">French</option><option value="es">Spanish</option><option value="hi">Hindi</option></select></div><div><label for="targetSelect">To</label><select id="targetSelect"><option value="en">English</option><option value="de">German</option><option value="ta">Tamil</option><option value="si">Sinhala</option><option value="fr">French</option><option value="es">Spanish</option><option value="hi">Hindi</option><option value="it">Italian</option><option value="nl">Dutch</option><option value="ar">Arabic</option></select></div></div><div style="margin-top:10px"><label for="quickInput">Text to translate</label><textarea id="quickInput" placeholder="Enter or paste text…"></textarea><button id="quickTranslateBtn" style="width:100%;margin-top:9px">Translate</button></div></section><section class="panel"><label>Translation</label><div id="quickResult" class="result">Your translation will appear here.</div></section><div class="foot"><a href="#" id="openOptions">⚙ Settings</a><span class="sub">Pira Code</span></div><script src="popup.js"></script></body></html>
